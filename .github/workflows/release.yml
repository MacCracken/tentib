name: Release

on:
  push:
    # X.Y.Z with an optional suffix (the cyrius init template's filter). A stray
    # tag that only starts with a digit does not start a release.
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

# Read-only by default. Only the release job, which publishes, gets
# contents: write, so the CI gate it calls never holds a write token.
permissions:
  contents: read

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pinned to a full commit SHA, as in ci.yml. persist-credentials false:
      # git archive needs no token, and the curl | sh installer below runs in
      # this job, which holds contents: write.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          CYML_RAW=$(grep '^version = ' cyrius.cyml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$CYML_RAW" = "\${file:VERSION}" ]; then CYML_VERSION="$FILE_VERSION"; else CYML_VERSION="$CYML_RAW"; fi
          TAG="${GITHUB_REF_NAME}"
          [ "$FILE_VERSION" = "$TAG" ] || { echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          [ "$CYML_VERSION" = "$TAG" ] || { echo "cyrius.cyml ($CYML_RAW) != tag ($TAG)"; exit 1; }
          echo "Version verified: $TAG"

      - name: Install Cyrius toolchain
        # Same upstream install.sh form as CI: version read from cyrius.cyml's
        # [package].cyrius pin (never hardcoded).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Build (DCE)
        run: |
          cyrius deps
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/${{ github.event.repository.name }}
          echo "tentib: $(wc -c < build/${{ github.event.repository.name }}) bytes"

      - name: Regenerate the library bundles
        # `cyrius distlib --all` writes dist/tentib.cyr and dist/tentib-gpu.cyr, stamped
        # from VERSION (1.3.0). CI's drift check already proved the committed bundles are
        # in sync; regenerating here ships freshly built bytes.
        run: cyrius distlib --all

      - name: Archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${{ github.event.repository.name }}"
          git archive --format=tar.gz --prefix="${NAME}-${TAG}/" -o "${NAME}-${TAG}-src.tar.gz" HEAD
          # The bundles as standalone, version-stamped assets — consumers import them via
          # [deps.tentib] modules = ["dist/tentib.cyr"] (+ dist/tentib-gpu.cyr for #82).
          cp dist/tentib.cyr "${NAME}-${TAG}.cyr"
          cp dist/tentib-gpu.cyr "${NAME}-gpu-${TAG}.cyr"
          sha256sum "${NAME}-${TAG}-src.tar.gz" "${NAME}-${TAG}.cyr" "${NAME}-gpu-${TAG}.cyr" "build/${NAME}" > SHA256SUMS

      - name: Extract changelog
        run: |
          awk "/^## \\[${GITHUB_REF_NAME}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md > "$RUNNER_TEMP/body.md"
          [ -s "$RUNNER_TEMP/body.md" ] || echo "No changelog entry for ${GITHUB_REF_NAME}." > "$RUNNER_TEMP/body.md"

      # The one step that uses the write token, so a moved tag here could rewrite
      # what a release ships: pinned to a full commit SHA.
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "tentib ${{ github.ref_name }}"
          body_path: ${{ runner.temp }}/body.md
          files: |
            ${{ github.event.repository.name }}-*-src.tar.gz
            ${{ github.event.repository.name }}-*.cyr
            build/${{ github.event.repository.name }}
            SHA256SUMS
